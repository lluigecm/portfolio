  sky: "#2b1d63", sky2: "#a3407a", horizon: "#ff9f5a",
  hill: "#2b6a48", hill2: "#4d8c57", grass: "#68b65c", dirt: "#7a4a30", dirt2: "#55301f",

var UI_KEYS = ["ink", "muted", "panel", "panel2", "line", "hi", "hi2", "title-shadow", "cart-label", "g1", "g2", "g3", "g4", "crt"];
function hex(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)] }
function mixColor(a, b, p) {
  if (typeof a === "number") return +(lerp(a, b, p)).toFixed(3);
  var x = hex(a), y = hex(b);
  return "#" + [0, 1, 2].map(function (i) { return ("0" + Math.round(lerp(x[i], y[i], p)).toString(16)).slice(-2) }).join("");
}
function themeAt(t) {
  var out = {}, k;
  /* cena: amanhecer lento; pôr do sol passando pelo laranja */
  var dayP = E.inOutCubic(pr(t, T.day, 1.3));
  var s1 = E.inOutCubic(pr(t, T.sunset, .9)), s2 = E.inOutCubic(pr(t, T.sunset + .9, 1.0));
  for (k in NIGHT) {
    if (UI_KEYS.indexOf(k) >= 0) continue;
    var v = mixColor(NIGHT[k], DAY[k], dayP);
    if (t >= T.sunset) v = s2 > 0 ? mixColor(SUNSET[k], NIGHT[k], s2) : mixColor(DAY[k], SUNSET[k], s1);
    out[k] = v;
  }
  /* interface: troca rápida, como o esmaecimento do botão de tema do site */
  var uiDay = E.inOutCubic(pr(t, T.day + .45, .3)), uiNight = E.inOutCubic(pr(t, T.sunset + .45, .3));
  UI_KEYS.forEach(function (k) { out[k] = t >= T.sunset ? mixColor(DAY[k], NIGHT[k], uiNight) : mixColor(NIGHT[k], DAY[k], uiDay) });
  return out;
}

/* =====================================================================
 * Funções de tempo
 * ===================================================================== */
function scrollAt(t) {
  var y = 0;
  for (var i = 0; i < SCROLLS.length; i++) {
    var s = SCROLLS[i];
    if (t < s[0]) break;
    y = t >= s[1] ? s[3] : lerp(s[2], s[3], E.inOutCubic((t - s[0]) / (s[1] - s[0])));
  }
  return y;
}
function groundAt(t) { return scrollAt(t) * .6 }
function moving(t) { return Math.abs(scrollAt(t) - scrollAt(t - 1 / 60)) > .4 }

/* altura do bot acima do chão e achatamento (squash) */
function botAir(t) {
  /* queda do céu na abertura */
  if (t < T.land) {
    var p = pr(t, T.drop, T.land - T.drop);
    return { y: 1200 * (1 - p * p), sx: 1, sy: p > 0 ? 1.12 : 1 };
  }
  var land = t - T.land;
  if (land < .45) {
    var q = land / .45, sq = Math.sin(q * Math.PI) * Math.exp(-q * 2.5);
    return { y: 0, sx: 1 + .32 * sq, sy: 1 - .3 * sq };
  }
  for (var i = 0; i < JUMPS.length; i++) {
    var j = JUMPS[i], top = j.bug ? 54 : 0;
    if (t >= j.t && t < j.t + j.d) {
      var p2 = (t - j.t) / j.d;
      return { y: lerp(0, top, p2) + j.h * 4 * p2 * (1 - p2), sx: .9, sy: 1.12 };
    }
    if (j.bug && t >= j.t + j.d && t < j.t + j.d + .38) {
      /* quica no bug e volta ao chão */
      var p3 = (t - j.t - j.d) / .38;
      var squash = p3 < .25 ? Math.sin(p3 / .25 * Math.PI) : 0;
      return { y: lerp(top, 0, p3) + 90 * 4 * p3 * (1 - p3), sx: 1 + .25 * squash, sy: 1 - .22 * squash };
    }
    if (!j.bug && t >= j.t + j.d && t < j.t + j.d + .2) {
      var p4 = (t - j.t - j.d) / .2, s4 = Math.sin(p4 * Math.PI);
      return { y: 0, sx: 1 + .22 * s4, sy: 1 - .2 * s4 };
    }
  }
  return { y: 0, sx: 1, sy: 1 };
}

var shakes = [[9.6, 10], [JUMPS[0].t + JUMPS[0].d, 12], [JUMPS[1].t + JUMPS[1].d, 12], [T.contato - .05, 16], [T.end + .2, 10]];
function shakeAt(t) {
  var x = 0, y = 0;
  shakes.forEach(function (s) {
    var d = t - s[0];
    if (d < 0 || d > .45) return;
    var a = s[1] * Math.exp(-d / .1);
    x += a * Math.sin(d * 71); y += a * Math.cos(d * 53);
  });
  return [x, y];
}

/* =====================================================================
 * Render: desenha o instante t
 * ===================================================================== */
var lastTheme = {};
function render(t) {
  /* tema */
  var th = themeAt(t);
  for (var k in th) if (lastTheme[k] !== th[k]) { stage.style.setProperty("--" + k, th[k]); lastTheme[k] = th[k] }

  var sy = scrollAt(t), gx = sy * .6, walking = moving(t);

  /* liga e desliga da TV (CRT) */
  var on = pr(t, T.crtOn, .55), off = pr(t, T.crtOff, .5);
  if (t < T.crtOn) { tf(screen, 0, 0, 0, 0); css(screen, "filter", "brightness(1)") }
  else if (on < 1) {
    var ph = E.outCubic(pr(t, T.crtOn, .22)), pv = E.outCubic(pr(t, T.crtOn + .2, .35));
    tf(screen, 0, 0, Math.max(.002, ph), Math.max(.004, pv));
    css(screen, "filter", "brightness(" + (1 + 5 * (1 - pv)).toFixed(2) + ")");
  } else if (off > 0) {

    var f = synth(sr), pcm = new Int16Array(f.length);
    for (var i = 0; i < f.length; i++) pcm[i] = Math.max(-32768, Math.min(32767, Math.round(f[i] * 32767)));
    var bytes = new Uint8Array(pcm.buffer), out = "", CH = 0x8000;
    for (var j = 0; j < bytes.length; j += CH) out += String.fromCharCode.apply(null, bytes.subarray(j, j + CH));
    return btoa(out);
  }
};

if (RENDER) {
  stage.style.transform = "none";
} else {
  fit();
  addEventListener("resize", fit);
  ready.then(function () {
    if (STILL != null) { render(STILL); return }
    var play = $("#play"), ctx = null, buffer = null, src = null;
    var t0 = 0, offset = 0, playing = false, raf = 0;
    play.hidden = false;
    function now() { return ctx ? ctx.currentTime : performance.now() / 1000 }
    function clock() { return playing ? offset + now() - t0 : offset }
    function start(at) {
      stop();
      offset = clamp(at, 0, DURATION); t0 = now(); playing = true;
      if (ctx && buffer) { src = ctx.createBufferSource(); src.buffer = buffer; src.connect(ctx.destination); src.start(0, offset) }
      raf = requestAnimationFrame(loop);
    }
    function stop() { if (src) { try { src.stop() } catch (e) { /* já parou */ } src = null } offset = clock(); playing = false; cancelAnimationFrame(raf) }
    function loop() {
      var t = clock();
      render(Math.min(t, DURATION));
      if (t >= DURATION) { playing = false; offset = 0; play.hidden = false; $("span", play).textContent = "↻ REPLAY"; return }
      raf = requestAnimationFrame(loop);
    }
    play.addEventListener("click", function () {
      play.hidden = true;
      if (!ctx) {
        try {
          ctx = new (window.AudioContext || window.webkitAudioContext)();
          var data = synth(ctx.sampleRate);
          buffer = ctx.createBuffer(1, data.length, ctx.sampleRate);
          buffer.copyToChannel(data, 0);
        } catch (e) { ctx = null }
      }
      start(0);
    });
    addEventListener("keydown", function (e) {
      if (play.hidden === false) return;
      if (e.key === " ") { e.preventDefault(); playing ? stop() : start(offset) }
      if (e.key === "ArrowRight") start(clock() + 5);
      if (e.key === "ArrowLeft") start(clock() - 5);
      if (e.key === "r" || e.key === "R") start(0);
    });
  });
}
})();
</script>
</body>
