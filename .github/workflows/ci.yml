name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: Lint, build e testes E2E
    # Fixado: a troca de versão do Ubuntu é uma decisão planejada, não automática.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Publicar relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
